name: Windows verification and packaging

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package on Python 3.12
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-py312.txt

      - name: Install constrained dependencies
        shell: pwsh
        run: |
          python -m pip install pip -c constraints-py312.txt
          python -m pip install -r requirements.txt -r requirements-build.txt -c constraints-py312.txt

      - name: Verify dependency health and tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -PythonExe python

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/lister_bridge.spec
          $artifact = Get-Item -LiteralPath dist/lister-bridge.exe
          if ($artifact.Length -le 0) {
            throw "dist/lister-bridge.exe is empty."
          }
          $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  lister-bridge.exe" | Set-Content -LiteralPath dist/lister-bridge.exe.sha256 -Encoding ascii

      - name: Upload executable and SHA-256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lister-bridge-windows-${{ github.sha }}
          path: |
            dist/lister-bridge.exe
            dist/lister-bridge.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
